apiVersion: apps/v1
kind: Deployment
metadata:
  name: api1
  namespace: apis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api1
  template:
    metadata:
      labels:
        app: api1
    spec:
      containers:
        - name: api1
          image: $(ACR_LOGIN_SERVER)/api1:$(IMAGE_TAG)
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api1-svc
  namespace: apis
spec:
  selector:
    app: api1
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
