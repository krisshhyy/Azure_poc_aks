# Azure DevOps Pipeline — Api1 (Products Service)
# Triggers on changes to src/Api1/**

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Api1/**
      - infra/k8s/api1-deployment.yaml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Api1/**

# ── Pipeline-level variables ───────────────────────────────────────────────────
# Set these in Azure DevOps Library or pipeline variables UI:
#   ACR_LOGIN_SERVER                    e.g. acrmyprojectpoc001.azurecr.io
#   AZURE_CONTAINER_REGISTRY_SERVICE_CONNECTION  name of the ACR service connection
#   AZURE_SERVICE_CONNECTION            name of the ARM service connection
#   AKS_RESOURCE_GROUP                  e.g. rg-myproject-poc
#   AKS_CLUSTER_NAME                    e.g. aks-myproject-poc
#   AKS_ENVIRONMENT_NAME                Azure DevOps Environment name (e.g. aks-poc)

variables:
  - group: poc-common-vars   # variable group defined in Azure DevOps Library

stages:
  - template: templates/build-push-deploy.yml
    parameters:
      apiName: api1
      projectPath: src/Api1
      k8sManifest: infra/k8s/api1-deployment.yaml
