# Azure DevOps Pipeline — Api3 (Notifications Service)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Api3/**
      - infra/k8s/api3-deployment.yaml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Api3/**

variables:
  - group: poc-common-vars

stages:
  - template: templates/build-push-deploy.yml
    parameters:
      apiName: api3
      projectPath: src/Api3
      k8sManifest: infra/k8s/api3-deployment.yaml
