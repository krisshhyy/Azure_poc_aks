# Reusable template: test → build → push to ACR → deploy to AKS
# Parameters:
#   apiName       - e.g. api1
#   projectPath   - relative path to the .csproj folder, e.g. src/Api1
#   k8sManifest   - path to the K8s deployment yaml
#   testProject   - (optional) path to test project, e.g. src/Api1.Tests

parameters:
  - name: apiName
    type: string
  - name: projectPath
    type: string
  - name: k8sManifest
    type: string
  - name: testProject
    type: string
    default: ""

stages:

# ── Stage 1: Test & Static Analysis ───────────────────────────────────────────
- stage: Test_${{ parameters.apiName }}
  displayName: "Test & Lint ${{ parameters.apiName }}"
  jobs:
    - job: RunTests
      displayName: "Unit tests + format check"
      pool:
        name: mylocalpool
      steps:
        # Static analysis — dotnet format
        # To enable: replace projectPath with full .csproj path e.g. src/Api5/Api5.csproj
        # - task: DotNetCoreCLI@2
        #   displayName: "dotnet format (style check)"
        #   inputs:
        #     command: custom
        #     custom: format
        #     arguments: "${{ parameters.projectPath }}/${{ parameters.apiName }}.csproj --verify-no-changes --severity warn"
        #   continueOnError: true

        # Unit tests (only if a test project is provided)
        - ${{ if ne(parameters.testProject, '') }}:
          - task: DotNetCoreCLI@2
            displayName: "dotnet restore"
            inputs:
              command: restore
              projects: "${{ parameters.testProject }}"

          - task: DotNetCoreCLI@2
            displayName: "dotnet test"
            inputs:
              command: test
              projects: "${{ parameters.testProject }}"
              arguments: "--configuration Release --no-restore --collect:\"XPlat Code Coverage\" --logger trx --results-directory $(Agent.TempDirectory)/TestResults"

          # Publish test results to Azure DevOps (shows pass/fail in pipeline UI)
          - task: PublishTestResults@2
            displayName: "Publish test results"
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "$(Agent.TempDirectory)/TestResults/**/*.trx"
              failTaskOnFailedTests: true

          # Publish code coverage
          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage"
            condition: always()
            inputs:
              summaryFileLocation: "$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml"

          # Fail the pipeline if coverage drops below threshold
          - powershell: |
              $xml = [xml](Get-Content (Get-ChildItem -Path "$(Agent.TempDirectory)/TestResults" -Filter "coverage.cobertura.xml" -Recurse | Select-Object -First 1).FullName)
              $lineRate = [double]$xml.coverage.'line-rate'
              $pct = [math]::Round($lineRate * 100, 2)
              Write-Host "Code coverage: $pct%"
              if ($pct -lt $(COVERAGE_THRESHOLD)) {
                Write-Error "Coverage $pct% is below threshold of $(COVERAGE_THRESHOLD)%"
                exit 1
              }
            displayName: "Enforce coverage threshold ($(COVERAGE_THRESHOLD)%)"

# ── Stage 2: Build & Push image to ACR ────────────────────────────────────────
- stage: Build_${{ parameters.apiName }}
  displayName: "Build & Push ${{ parameters.apiName }}"
  dependsOn: Test_${{ parameters.apiName }}
  condition: succeeded()
  jobs:
    - job: BuildAndPush
      displayName: "Docker build → ACR"
      pool:
        name: mylocalpool
      steps:
        - task: Docker@2
          displayName: "Build & push image"
          inputs:
            command: buildAndPush
            containerRegistry: $(AZURE_CONTAINER_REGISTRY_SERVICE_CONNECTION)
            repository: ${{ parameters.apiName }}
            dockerfile: ${{ parameters.projectPath }}/Dockerfile
            buildContext: ${{ parameters.projectPath }}
            tags: |
              $(Build.BuildId)
              latest

# ── Stage 3: Deploy to AKS ────────────────────────────────────────────────────
- stage: Deploy_${{ parameters.apiName }}
  displayName: "Deploy ${{ parameters.apiName }} to AKS"
  dependsOn: Build_${{ parameters.apiName }}
  condition: succeeded()
  jobs:
    - deployment: DeployToAKS
      displayName: "kubectl apply"
      environment: $(AKS_ENVIRONMENT_NAME)
      pool:
        name: mylocalpool
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - powershell: |
                  $manifest = "${{ parameters.k8sManifest }}"
                  (Get-Content $manifest) `
                    -replace '\$\(ACR_LOGIN_SERVER\)', "$(ACR_LOGIN_SERVER)" `
                    -replace '\$\(IMAGE_TAG\)',        "$(Build.BuildId)" |
                  Set-Content $manifest
                displayName: "Substitute image variables in manifest"

              - task: KubernetesManifest@1
                displayName: "Apply K8s manifest"
                inputs:
                  action: deploy
                  connectionType: azureResourceManager
                  azureSubscriptionConnection: $(AZURE_SERVICE_CONNECTION)
                  azureResourceGroup: $(AKS_RESOURCE_GROUP)
                  kubernetesCluster: $(AKS_CLUSTER_NAME)
                  namespace: apis
                  manifests: ${{ parameters.k8sManifest }}
