# Reusable template: test → build → push to ACR → deploy to dev/test/prod based on branch
# Parameters:
#   apiName           - e.g. api1
#   projectPath       - relative path to the .csproj folder, e.g. src/Api1
#   k8sManifest       - path to the K8s deployment yaml
#   testProject       - (optional) path to test project
#   coverageThreshold - (optional) minimum coverage %, default 60

parameters:
  - name: apiName
    type: string
  - name: projectPath
    type: string
  - name: k8sManifest
    type: string
  - name: testProject
    type: string
    default: ""
  - name: coverageThreshold
    type: number
    default: 60

# Resolve target environment from branch name
variables:
  - name: targetNamespace
    ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      value: prod
    ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
      value: test
    ${{ else }}:
      value: dev
  - name: environmentName
    ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      value: "aks-prod"
    ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
      value: "aks-test"
    ${{ else }}:
      value: "aks-dev"

stages:

# ── Stage 1: Test & Static Analysis ───────────────────────────────────────────
- stage: Test_${{ parameters.apiName }}
  displayName: "🧪 Test & Lint [${{ parameters.apiName }}]"
  jobs:
    - job: RunTests
      displayName: "Unit tests + coverage"
      pool:
        name: mylocalpool
      steps:
        # Static analysis — dotnet format
        # - task: DotNetCoreCLI@2
        #   displayName: "dotnet format (style check)"
        #   inputs:
        #     command: custom
        #     custom: format
        #     arguments: "${{ parameters.projectPath }}/${{ parameters.apiName }}.csproj --verify-no-changes --severity warn"
        #   continueOnError: true

        # Unit tests (only if a test project is provided)
        - ${{ if ne(parameters.testProject, '') }}:
          - task: DotNetCoreCLI@2
            displayName: "dotnet restore"
            inputs:
              command: restore
              projects: "${{ parameters.testProject }}"

          - powershell: |
              $testProject = "${{ parameters.testProject }}"
              $trxDir = "$(Agent.TempDirectory)\TestResults"
              $coverageFile = "$(Build.SourcesDirectory)\coverage.cobertura.xml"
              New-Item -ItemType Directory -Force -Path $trxDir | Out-Null
              dotnet test $testProject `
                --configuration Release `
                --no-restore `
                --logger "trx;LogFileName=results.trx" `
                --results-directory $trxDir `
                /p:CollectCoverage=true `
                /p:CoverletOutputFormat=cobertura `
                /p:CoverletOutput=$coverageFile `
                /p:Exclude="[*]*.Program%2C[*]*JsonPlaceholder*%2C[*]*Address%2C[*]*Company"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: "dotnet test"

          - task: PublishTestResults@2
            displayName: "Publish test results"
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "$(Agent.TempDirectory)/TestResults/results.trx"
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage"
            condition: always()
            inputs:
              summaryFileLocation: "$(Build.SourcesDirectory)/coverage.cobertura.xml"

          - powershell: |
              $threshold = ${{ parameters.coverageThreshold }}
              $xmlFile = "$(Build.SourcesDirectory)\coverage.cobertura.xml"
              if (-not (Test-Path $xmlFile)) {
                Write-Warning "No coverage file found — skipping threshold check"
                exit 0
              }
              $xml = [xml](Get-Content $xmlFile)
              $lineRate = [double]$xml.coverage.'line-rate'
              $pct = [math]::Round($lineRate * 100, 2)
              Write-Host "Code coverage: $pct%"
              Write-Host "Threshold: $threshold%"
              if ($pct -lt $threshold) {
                Write-Error "Coverage $pct% is below threshold of $threshold%"
                exit 1
              }
              Write-Host "Coverage check passed."
            displayName: "Enforce coverage threshold (${{ parameters.coverageThreshold }}%)"

# ── Stage 2: Build & Push image to ACR ────────────────────────────────────────
- stage: Build_${{ parameters.apiName }}
  displayName: "🐳 Build & Push [${{ parameters.apiName }}]"
  dependsOn: Test_${{ parameters.apiName }}
  condition: succeeded()
  jobs:
    - job: BuildAndPush
      displayName: "Docker build → ACR"
      pool:
        name: mylocalpool
      steps:
        - task: Docker@2
          displayName: "Build & push image"
          inputs:
            command: buildAndPush
            containerRegistry: $(AZURE_CONTAINER_REGISTRY_SERVICE_CONNECTION)
            repository: ${{ parameters.apiName }}
            dockerfile: ${{ parameters.projectPath }}/Dockerfile
            buildContext: ${{ parameters.projectPath }}
            tags: |
              $(Build.BuildId)
              latest

# ── Stage 3: Deploy to Dev ────────────────────────────────────────────────────
- stage: Deploy_Dev_${{ parameters.apiName }}
  displayName: "🚀 Deploy to DEV [${{ parameters.apiName }}]"
  dependsOn: Build_${{ parameters.apiName }}
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))
  jobs:
    - deployment: DeployToDev
      displayName: "Deploy → dev namespace"
      environment: aks-dev
      pool:
        name: mylocalpool
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - powershell: |
                  $manifest = "${{ parameters.k8sManifest }}"
                  (Get-Content $manifest) `
                    -replace '\$\(ACR_LOGIN_SERVER\)', "$(ACR_LOGIN_SERVER)" `
                    -replace '\$\(IMAGE_TAG\)',        "$(Build.BuildId)" |
                  Set-Content $manifest
                displayName: "Substitute image variables"
              - task: KubernetesManifest@1
                displayName: "kubectl apply → dev"
                inputs:
                  action: deploy
                  connectionType: azureResourceManager
                  azureSubscriptionConnection: $(AZURE_SERVICE_CONNECTION)
                  azureResourceGroup: $(AKS_RESOURCE_GROUP)
                  kubernetesCluster: $(AKS_CLUSTER_NAME)
                  namespace: dev
                  manifests: ${{ parameters.k8sManifest }}

# ── Stage 4: Deploy to Test ───────────────────────────────────────────────────
- stage: Deploy_Test_${{ parameters.apiName }}
  displayName: "🧪 Deploy to TEST [${{ parameters.apiName }}]"
  dependsOn: Build_${{ parameters.apiName }}
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'test'))
  jobs:
    - deployment: DeployToTest
      displayName: "Deploy → test namespace"
      environment: aks-test
      pool:
        name: mylocalpool
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - powershell: |
                  $manifest = "${{ parameters.k8sManifest }}"
                  (Get-Content $manifest) `
                    -replace '\$\(ACR_LOGIN_SERVER\)', "$(ACR_LOGIN_SERVER)" `
                    -replace '\$\(IMAGE_TAG\)',        "$(Build.BuildId)" |
                  Set-Content $manifest
                displayName: "Substitute image variables"
              - task: KubernetesManifest@1
                displayName: "kubectl apply → test"
                inputs:
                  action: deploy
                  connectionType: azureResourceManager
                  azureSubscriptionConnection: $(AZURE_SERVICE_CONNECTION)
                  azureResourceGroup: $(AKS_RESOURCE_GROUP)
                  kubernetesCluster: $(AKS_CLUSTER_NAME)
                  namespace: test
                  manifests: ${{ parameters.k8sManifest }}

# ── Stage 5: Deploy to Prod ───────────────────────────────────────────────────
- stage: Deploy_Prod_${{ parameters.apiName }}
  displayName: "🏭 Deploy to PROD [${{ parameters.apiName }}]"
  dependsOn: Build_${{ parameters.apiName }}
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
    - deployment: DeployToProd
      displayName: "Deploy → prod namespace"
      environment: aks-prod        # add approval gate on this environment in Azure DevOps
      pool:
        name: mylocalpool
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - powershell: |
                  $manifest = "${{ parameters.k8sManifest }}"
                  (Get-Content $manifest) `
                    -replace '\$\(ACR_LOGIN_SERVER\)', "$(ACR_LOGIN_SERVER)" `
                    -replace '\$\(IMAGE_TAG\)',        "$(Build.BuildId)" |
                  Set-Content $manifest
                displayName: "Substitute image variables"
              - task: KubernetesManifest@1
                displayName: "kubectl apply → prod"
                inputs:
                  action: deploy
                  connectionType: azureResourceManager
                  azureSubscriptionConnection: $(AZURE_SERVICE_CONNECTION)
                  azureResourceGroup: $(AKS_RESOURCE_GROUP)
                  kubernetesCluster: $(AKS_CLUSTER_NAME)
                  namespace: prod
                  manifests: ${{ parameters.k8sManifest }}
